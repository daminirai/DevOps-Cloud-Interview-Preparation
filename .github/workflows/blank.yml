name: Node.js CI

on:
  push:
    branches:
      - main
      - develop 
      
  pull_request:
    branches:
      - main
      - develop
      
  workflow_dispatch:

jobs:
  ci:
    name: Build, Lint and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Eslint
        run: npm run lint

      - name: Check Formatting
        run: npm run format:check

      - name: Run tests
        run: npm run test:ci

      - name: Build Application
        run: npm run build
